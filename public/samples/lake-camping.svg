<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="twilight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="40%" stop-color="#4C1D95"/>
      <stop offset="75%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="lake-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Twilight Sky -->
  <rect width="800" height="380" fill="url(#twilight)"/>
  <!-- Crescent Moon & Stars -->
  <path d="M 690,60 A 25 25 0 0 0 710,95 A 30 30 0 1 1 690,60 Z" fill="#FEF08A"/>
  <circle cx="200" cy="80" r="2" fill="#FFFFFF"/>
  <circle cx="340" cy="50" r="2.5" fill="#FFFFFF"/>
  <circle cx="480" cy="95" r="2" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="1.5" fill="#FFFFFF"/>

  <!-- Calm Mirror Lake -->
  <rect y="360" width="800" height="240" fill="url(#lake-water)"/>
  <!-- Light reflection on water -->
  <path d="M 360,370 L 440,370 L 470,550 L 330,550 Z" fill="#F59E0B" opacity="0.15"/>

  <!-- Lakeside Shoreline -->
  <path d="M 0,440 Q 250,420 500,430 T 800,410 L 800,600 L 0,600 Z" fill="#1E293B"/>

  <!-- Camping Tent on Left -->
  <g transform="translate(60, 360)">
    <polygon points="120,30 20,160 220,160" fill="#EA580C"/>
    <polygon points="120,30 220,160 270,140 180,20" fill="#C2410C"/>
    <!-- Tent flap opening with lantern glow -->
    <polygon points="120,60 70,160 170,160" fill="#FEF08A" opacity="0.9"/>
  </g>

  <!-- Campfire with Roasting Family -->
  <g transform="translate(380, 430)">
    <!-- Firewood -->
    <polygon points="10,65 70,45 75,55 15,75" fill="#78350F"/>
    <polygon points="10,50 65,75 55,85 0,60" fill="#92400E"/>
    <!-- Glowing Orange & Yellow Flame -->
    <path d="M 25,50 Q 15,25 35,5 Q 25,25 45,0 Q 60,25 50,45 Q 65,35 60,55 Z" fill="#F97316"/>
    <path d="M 30,48 Q 28,32 38,18 Q 45,30 42,48 Z" fill="#FEF08A"/>
  </g>

  <!-- Family Silhouettes Sitting by the Fire -->
  <!-- Dad Left -->
  <g transform="translate(300, 400)">
    <circle cx="35" cy="30" r="16" fill="#FDE68A"/>
    <path d="M 15,48 L 55,48 L 60,110 L 10,110 Z" fill="#0284C7"/>
    <!-- Roasting stick pointing to fire -->
    <line x1="45" y1="65" x2="90" y2="55" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="85" y="50" width="10" height="8" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Mom Right -->
  <g transform="translate(470, 405)">
    <circle cx="35" cy="30" r="15" fill="#FDE68A"/>
    <path d="M 15,48 L 55,48 L 58,110 L 12,110 Z" fill="#A855F7"/>
    <line x1="25" y1="65" x2="-20" y2="55" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="-25" y="50" width="10" height="8" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Canoe on lake shore -->
  <g transform="translate(600, 410)">
    <path d="M 0,50 Q 80,85 160,50 Q 80,65 0,50 Z" fill="#DC2626"/>
    <line x1="40" y1="40" x2="90" y2="60" stroke="#78350F" stroke-width="4"/>
  </g>

  <!-- Badges -->
  <rect x="25" y="25" width="240" height="40" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="40" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">🏕️ Lake Tahoe Campfire</text>
  <rect x="635" y="25" width="140" height="40" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="650" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F472B6">Family Camping</text>
</svg>
