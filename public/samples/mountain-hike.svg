<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky-mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="pine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="360" fill="url(#sky-mtn)"/>
  <circle cx="120" cy="100" r="40" fill="#FEF08A"/>

  <!-- Distant Snowy Peaks -->
  <polygon points="50,300 180,120 310,300" fill="#64748B"/>
  <polygon points="180,120 145,170 180,185 210,165 220,180" fill="#FFFFFF"/>

  <polygon points="220,320 400,90 580,320" fill="#475569"/>
  <polygon points="400,90 355,155 400,180 445,150" fill="#FFFFFF"/>

  <polygon points="480,300 640,140 800,300" fill="#64748B"/>
  <polygon points="640,140 600,180 640,200 680,175" fill="#FFFFFF"/>

  <!-- Alpine Meadows & Foothills -->
  <path d="M0,320 Q240,280 480,310 T800,290 L800,600 L0,600 Z" fill="#15803D"/>
  <path d="M0,400 Q400,360 800,390 L800,600 L0,600 Z" fill="#166534"/>

  <!-- Pine Trees -->
  <g transform="translate(40, 260)">
    <polygon points="30,0 10,50 50,50" fill="url(#pine)"/>
    <polygon points="30,30 5,80 55,80" fill="url(#pine)"/>
    <polygon points="30,60 0,110 60,110" fill="url(#pine)"/>
    <rect x="25" y="110" width="10" height="25" fill="#78350F"/>
  </g>
  <g transform="translate(680, 240)">
    <polygon points="40,0 15,60 65,60" fill="url(#pine)"/>
    <polygon points="40,40 10,100 70,100" fill="url(#pine)"/>
    <polygon points="40,75 5,140 75,140" fill="url(#pine)"/>
    <rect x="33" y="140" width="14" height="30" fill="#78350F"/>
  </g>

  <!-- Trail Path -->
  <path d="M120,600 Q360,460 480,420 T700,380" stroke="#D97706" stroke-width="60" fill="none" opacity="0.7"/>

  <!-- Hiking Family of 4 -->
  <!-- Dad with Giant Backpack -->
  <g transform="translate(260, 280)">
    <!-- Backpack -->
    <rect x="5" y="90" width="30" height="65" rx="6" fill="#EA580C"/>
    <!-- Body -->
    <rect x="35" y="85" width="45" height="95" rx="4" fill="#1E40AF"/>
    <!-- Hiking Pants -->
    <rect x="38" y="180" width="16" height="70" fill="#78350F"/>
    <rect x="58" y="180" width="16" height="70" fill="#78350F"/>
    <!-- Head with Outdoor Cap -->
    <circle cx="58" cy="50" r="24" fill="#FBCFE8"/>
    <path d="M35,45 Q58,30 80,45" fill="#374151"/>
    <circle cx="52" cy="50" r="3" fill="#1E293B"/>
    <circle cx="65" cy="50" r="3" fill="#1E293B"/>
    <path d="M52,60 Q58,66 65,60" stroke="#991B1B" stroke-width="2" fill="none"/>
    <!-- Walking Stick -->
    <line x1="85" y1="110" x2="105" y2="245" stroke="#92400E" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Mom in Hiking Vest -->
  <g transform="translate(370, 290)">
    <rect x="25" y="85" width="40" height="90" rx="4" fill="#BE185D"/>
    <!-- Vest -->
    <path d="M25,85 L38,175 L22,175 Z" fill="#9D174D"/>
    <path d="M65,85 L52,175 L68,175 Z" fill="#9D174D"/>
    <!-- Pants -->
    <rect x="28" y="175" width="15" height="65" fill="#374151"/>
    <rect x="47" y="175" width="15" height="65" fill="#374151"/>
    <!-- Head -->
    <circle cx="45" cy="52" r="22" fill="#FBCFE8"/>
    <circle cx="40" cy="52" r="3" fill="#1E293B"/>
    <circle cx="52" cy="52" r="3" fill="#1E293B"/>
    <path d="M40,62 Q46,67 52,62" stroke="#BE123C" stroke-width="2" fill="none"/>
  </g>

  <!-- Junior Boy (Age 9) -->
  <g transform="translate(450, 330)">
    <!-- Small blue daypack -->
    <rect x="5" y="60" width="18" height="40" rx="4" fill="#0284C7"/>
    <rect x="20" y="60" width="30" height="65" rx="3" fill="#16A34A"/>
    <rect x="22" y="125" width="11" height="50" fill="#1F2937"/>
    <rect x="36" y="125" width="11" height="50" fill="#1F2937"/>
    <circle cx="35" cy="38" r="18" fill="#FBCFE8"/>
    <circle cx="31" cy="38" r="2.5" fill="#1E293B"/>
    <circle cx="40" cy="38" r="2.5" fill="#1E293B"/>
    <path d="M31,46 Q35,50 40,46" stroke="#991B1B" stroke-width="2" fill="none"/>
  </g>

  <!-- Girl (Age 7) with Camera -->
  <g transform="translate(510, 345)">
    <rect x="18" y="55" width="28" height="60" rx="3" fill="#8B5CF6"/>
    <rect x="20" y="115" width="10" height="45" fill="#4B5563"/>
    <rect x="33" y="115" width="10" height="45" fill="#4B5563"/>
    <circle cx="32" cy="35" r="17" fill="#FBCFE8"/>
    <circle cx="28" cy="35" r="2.5" fill="#1E293B"/>
    <circle cx="37" cy="35" r="2.5" fill="#1E293B"/>
    <path d="M28,42 Q32,46 37,42" stroke="#DC2626" stroke-width="2" fill="none"/>
    <!-- Toy Camera -->
    <rect x="23" y="70" width="18" height="12" rx="2" fill="#F59E0B"/>
    <circle cx="32" cy="76" r="4" fill="#1E293B"/>
  </g>

  <!-- Badges -->
  <rect x="25" y="25" width="230" height="40" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="40" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">🏔️ Rocky Mountain Hike</text>
  <rect x="635" y="25" width="140" height="40" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="650" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FDE047">4 Family Hikers</text>
</svg>
