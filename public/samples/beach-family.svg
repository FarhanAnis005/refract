<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="340" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="45" fill="#FBBF24" opacity="0.9"/>

  <!-- Fluffy Clouds -->
  <ellipse cx="200" cy="110" rx="60" ry="22" fill="#FFFFFF" opacity="0.85"/>
  <ellipse cx="230" cy="95" rx="40" ry="25" fill="#FFFFFF" opacity="0.85"/>
  <ellipse cx="500" cy="140" rx="70" ry="24" fill="#FFFFFF" opacity="0.8"/>

  <!-- Ocean -->
  <rect y="320" width="800" height="110" fill="url(#sea)"/>
  <path d="M0,320 Q200,315 400,320 T800,320 L800,345 Q600,340 400,345 T0,345 Z" fill="#E0F2FE" opacity="0.6"/>

  <!-- Shoreline Sandy Beach -->
  <path d="M0,400 Q400,380 800,410 L800,600 L0,600 Z" fill="url(#sand)"/>

  <!-- Family Group (5 people) -->
  <!-- Dad (Left) -->
  <g transform="translate(180, 260)">
    <!-- Legs -->
    <rect x="35" y="190" width="16" height="80" fill="#3B82F6"/>
    <rect x="55" y="190" width="16" height="80" fill="#3B82F6"/>
    <!-- Torso / Aloha Shirt -->
    <path d="M25,85 L85,85 L90,195 L20,195 Z" fill="#0D9488"/>
    <circle cx="45" cy="120" r="6" fill="#FBBF24"/>
    <circle cx="65" cy="150" r="7" fill="#FBBF24"/>
    <!-- Head -->
    <circle cx="55" cy="50" r="26" fill="#FBCFE8"/>
    <!-- Hair & Sunglasses -->
    <path d="M30,42 Q55,20 80,42" fill="#78350F"/>
    <rect x="38" y="45" width="15" height="10" rx="2" fill="#1E293B"/>
    <rect x="58" y="45" width="15" height="10" rx="2" fill="#1E293B"/>
    <line x1="53" y1="50" x2="58" y2="50" stroke="#1E293B" stroke-width="2"/>
    <path d="M46,65 Q55,72 64,65" stroke="#991B1B" stroke-width="2" fill="none"/>
  </g>

  <!-- Big Sister (Age 10) -->
  <g transform="translate(290, 310)">
    <rect x="25" y="140" width="10" height="75" fill="#FDE047"/>
    <rect x="42" y="140" width="10" height="75" fill="#FDE047"/>
    <!-- Yellow Sundress -->
    <path d="M20,65 L57,65 L68,145 L10,145 Z" fill="#FACC15"/>
    <circle cx="38" cy="40" r="20" fill="#FBCFE8"/>
    <!-- Brown Braids -->
    <path d="M20,35 Q38,18 56,35" fill="#92400E"/>
    <circle cx="32" cy="38" r="3" fill="#1E293B"/>
    <circle cx="45" cy="38" r="3" fill="#1E293B"/>
    <path d="M32,50 Q38,56 45,50" stroke="#DC2626" stroke-width="2" fill="none"/>
  </g>

  <!-- Little Brother (Age 6, Center) with Beach Ball -->
  <g transform="translate(375, 340)">
    <rect x="18" y="120" width="9" height="65" fill="#EF4444"/>
    <rect x="32" y="120" width="9" height="65" fill="#EF4444"/>
    <!-- Blue Striped Tee -->
    <path d="M15,50 L45,50 L48,120 L12,120 Z" fill="#2563EB"/>
    <line x1="13" y1="70" x2="47" y2="70" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="13" y1="90" x2="47" y2="90" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Head with backwards red cap -->
    <circle cx="30" cy="30" r="18" fill="#FBCFE8"/>
    <path d="M15,24 Q30,12 45,24 L52,24" stroke="#DC2626" stroke-width="6" fill="#DC2626"/>
    <circle cx="25" cy="30" r="2.5" fill="#1E293B"/>
    <circle cx="35" cy="30" r="2.5" fill="#1E293B"/>
    <path d="M26,38 Q30,42 35,38" stroke="#DC2626" stroke-width="2" fill="none"/>
    <!-- Beach Ball -->
    <circle cx="68" cy="115" r="22" fill="#F97316"/>
    <path d="M68,93 Q52,115 68,137" fill="#3B82F6"/>
    <path d="M68,93 Q84,115 68,137" fill="#EAB308"/>
  </g>

  <!-- Mom (Right Center) -->
  <g transform="translate(450, 255)">
    <rect x="32" y="195" width="14" height="85" fill="#FBCFE8"/>
    <rect x="52" y="195" width="14" height="85" fill="#FBCFE8"/>
    <!-- Coral Dress -->
    <path d="M25,85 L75,85 L90,200 L12,200 Z" fill="#FB7185"/>
    <circle cx="50" cy="50" r="24" fill="#FBCFE8"/>
    <!-- Blonde Hair with Wide Sunhat -->
    <ellipse cx="50" cy="35" rx="55" ry="16" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
    <circle cx="43" cy="50" r="3" fill="#1E293B"/>
    <circle cx="57" cy="50" r="3" fill="#1E293B"/>
    <path d="M43,62 Q50,70 57,62" stroke="#BE123C" stroke-width="2" fill="none"/>
  </g>

  <!-- Toddler (Far Right, Age 3) -->
  <g transform="translate(555, 370)">
    <path d="M10,40 L35,40 L38,95 L8,95 Z" fill="#10B981"/>
    <circle cx="23" cy="24" r="14" fill="#FBCFE8"/>
    <circle cx="19" cy="24" r="2" fill="#1E293B"/>
    <circle cx="27" cy="24" r="2" fill="#1E293B"/>
    <path d="M20,30 Q23,34 26,30" stroke="#047857" stroke-width="1.5" fill="none"/>
    <!-- Green bucket in hand -->
    <polygon points="40,75 52,75 50,92 42,92" fill="#059669"/>
  </g>

  <!-- Palm Tree at left -->
  <path d="M40,550 Q60,300 20,120 L40,120 Q80,300 60,550 Z" fill="#78350F"/>
  <path d="M30,125 Q-30,90 -60,130" stroke="#15803D" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M30,125 Q-10,40 -20,-10" stroke="#16A34A" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M30,125 Q80,50 120,60" stroke="#15803D" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M30,125 Q90,110 130,150" stroke="#16A34A" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Badge / Overlay tag -->
  <rect x="25" y="25" width="220" height="40" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="40" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">🏖️ Maui Vacation 2024</text>
  <rect x="625" y="25" width="150" height="40" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="640" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">5 Family Members</text>
</svg>
